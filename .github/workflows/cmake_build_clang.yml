name: CMake on Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        build_type: [Release]
        c_compiler: [clang]
        include:
          - os: windows-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc

    steps:
    - uses: actions/checkout@v4

    - name: Install CMake 4.4.3
      shell: pwsh
      env:
        CMAKE_VERSION: 4.4.3
      run: |
        $url = "https://github.com/Kitware/CMake/releases/download/v$env:CMAKE_VERSION/cmake-$env:CMAKE_VERSION-windows-x86_64.zip"
        $archive = Join-Path $env:RUNNER_TEMP 'cmake.zip'
        $dest = Join-Path $env:RUNNER_TEMP 'cmake'
        curl.exe -L --fail --retry 3 -o $archive $url
        Expand-Archive -Path $archive -DestinationPath $dest -Force
        $bin = Join-Path (Join-Path $dest "cmake-$env:CMAKE_VERSION-windows-x86_64") 'bin'
        Add-Content -Path $env:GITHUB_PATH -Value $bin
        & (Join-Path $bin 'cmake.exe') --version

    - name: Install LLVM
      shell: pwsh
      env:
        LLVM_VERSION: 23.1.0
      run: |
        $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
        $archive = Join-Path $env:RUNNER_TEMP 'llvm.tar.xz'
        $dest = Join-Path $env:RUNNER_TEMP 'llvm'
        curl.exe -L --fail --retry 3 -o $archive $url
        New-Item -ItemType Directory -Path $dest -Force | Out-Null
        tar -xf $archive -C $dest --strip-components=1
        Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest 'bin')
        & (Join-Path $dest 'bin\clang++.exe') --version

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -GNinja -B ${{ steps.strings.outputs.build-output-dir }}
        -DCUPY_LIBS_DLL_TO_BIN=OFF
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      timeout-minutes: 10
      run: ctest --build-config ${{ matrix.build_type }} -VV
